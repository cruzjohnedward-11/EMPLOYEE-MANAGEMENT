services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ems_db
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_ROOT_PASSWORD: ${EMS_DB_PASSWORD:-}
      MARIADB_ROOT_HOST: "%"
    volumes:
      - ems_db_data:/var/lib/mysql
      - ./employee_management.sql:/docker-entrypoint-initdb.d/01-ems-schema.sql:ro
    networks:
      - ems-database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EMS_DB_HOST: db
      EMS_DB_PORT: "3306"
      EMS_DB_NAME: ems_db
      EMS_DB_USER: root
      EMS_DB_PASSWORD: ${EMS_DB_PASSWORD:-}
    volumes:
      - ./:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ems-app
      - ems-database
      - ems-egress

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - ems-lan
      - ems-app

networks:
  ems-lan:
    driver: bridge
  ems-app:
    driver: bridge
    internal: true
  ems-database:
    driver: bridge
    internal: true
  ems-egress:
    driver: bridge

volumes:
  ems_db_data:
